<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAN432 Presentation</title>
<style>
  :root { --bg: #03395a; --fg: #ffffff; --muted: #9fd0e8; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         padding: 0 16px; }
  main { text-align: center; max-width: 32rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a { display: inline-block; padding: .8rem 1.4rem; border-radius: 6px;
      background: var(--fg); color: var(--bg); font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>BAN432 presentation</h1>
  <p>The download starts automatically. If it does not, use the button.</p>
  <a id="dl" href="BAN432-presentation.pdf" download="BAN432 presentation.pdf">Download PDF</a>
</main>
<script>
  window.addEventListener("load", function () { document.getElementById("dl").click(); });
</script>
</body>
</html>
